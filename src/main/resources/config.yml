# Messages.
messages:
  noperm:
    - "[message] &cYou don't have enough rights."
  help:
    - "[message] &aHelp:"
    - "[message] &a/jambience reload &f- Reload the plugin configuration."
    - "[message] &a/jambience status &f- Get the plugin status."
    - "[message] &a/jambience set value double &f- Set the parameter for the weather."
    - "[message] &a/jambience update &f- Update information from WeatherAPI."